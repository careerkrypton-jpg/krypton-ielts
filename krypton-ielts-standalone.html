    // IELTS Official Rounding Algorithm
    function calculateOverallBand(scores) {
      if (!scores || scores.length === 0) return 0;
      const valid = scores.filter(s => s > 0);
      if (valid.length === 0) return 0;
      const avg = valid.reduce((a, b) => a + b, 0) / valid.length;
      const floor = Math.floor(avg);
      const rem = avg - floor;
      if (rem < 0.25) return floor;
      if (rem < 0.75) return floor + 0.5;
      return floor + 1.0;
    }

    function calculateReadingBand(raw) {
      if (raw >= 39) return 9.0;
      if (raw >= 37) return 8.5;
      if (raw >= 35) return 8.0;
      if (raw >= 33) return 7.5;
      if (raw >= 30) return 7.0;
      if (raw >= 27) return 6.5;
      if (raw >= 23) return 6.0;
      if (raw >= 19) return 5.5;
      if (raw >= 15) return 5.0;
      if (raw >= 13) return 4.5;
      if (raw >= 10) return 4.0;
      return 3.5;
    }

    // Audio chime generator
    function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.85);
      } catch (e) {}
    }

                <div className="w-full md:w-1/2 overflow-y-auto p-6 md:p-8 bg-slate-50">
                  <div className="max-w-xl mx-auto space-y-5">
                    <div className="text-xs font-bold text-slate-500 uppercase border-b pb-2">
                      Questions 1 to 5 (Passage 1)
                    </div>
                    {BARRON_TEST_1_QUESTIONS.map((q) => (
                      <div key={q.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="w-6 h-6 rounded-lg bg-[#173F7A] text-white font-mono font-bold text-xs flex items-center justify-center">{q.num}</span>
                          <span className="text-[10px] uppercase font-bold text-slate-400">{q.type}</span>
                        </div>
                        <p className="text-xs font-semibold text-slate-800">{q.q}</p>
                        <div className="space-y-1.5">
                          {q.options.map((opt, i) => (
                            <button
                              key={i}
                              onClick={() => setAnswers({ ...answers, [q.id]: opt })}
                              className={`w-full text-left p-2.5 rounded-xl text-xs font-medium border transition ${
                                answers[q.id] === opt ? 'border-blue-600 bg-blue-50 text-blue-900 font-bold' : 'border-slate-200 hover:bg-slate-50'
                              }`}
                            >
                              {opt}
                            </button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* VIEW: RESULT SCORECARD */}
          {view === 'result' && testResult && (
            <div className="max-w-4xl mx-auto px-4 py-8 space-y-6 flex-1">
              <button onClick={() => setView('dashboard')} className="text-xs font-bold text-[#173F7A] hover:underline">
                ← Return to Dashboard
              </button>
              <div id="printable-report" className="bg-white rounded-3xl p-8 border-2 border-slate-300 shadow-xl space-y-6">
                <div className="border-b pb-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <img src="public/krypton-logo.jpg" alt="Kathmandu Krypton" className="h-10 object-contain" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                    <div>
                      <h2 className="text-lg font-black text-[#173F7A]">KATHMANDU KRYPTON EDUCATIONAL CONSULTANCY</h2>
                      <p className="text-xs text-[#DC2626] font-bold">Putalisadak, Kathmandu • Official Diagnostic Score Report</p>
                    </div>
                  </div>
                  <div className="text-right text-xs font-mono">{testResult.date}</div>
                </div>

                <div className="text-center p-6 bg-blue-50 rounded-2xl border border-blue-200 space-y-2">
                  <div className="text-xs font-bold text-slate-500 uppercase">Predicted IELTS Band Score</div>
                  <div className="text-6xl font-black text-[#173F7A] font-mono">{testResult.band.toFixed(1)}</div>
                  <div className="text-xs text-slate-600 font-medium">Raw Score: {testResult.rawScore} / {testResult.total} Correct</div>
                </div>

                <div className="space-y-3">
                  <h4 className="font-bold text-sm text-slate-900">Answer Key & Official Citations</h4>
                  {BARRON_TEST_1_QUESTIONS.map((q) => (
                    <div key={q.id} className="p-3 bg-slate-50 rounded-xl border text-xs space-y-1">
                      <div className="flex justify-between font-bold">
                        <span>Q{q.num}: {q.q}</span>
                        <span className="text-emerald-700">Official Answer: {q.correct}</span>
                      </div>
                      <p className="text-slate-500 italic">Citation: {q.explanation}</p>
                    </div>
                  ))}
                </div>

                <div className="pt-4 border-t flex justify-between items-center text-xs text-slate-500">
                  <div>IELTS Faculty: Kushal Adhikari (9706462842) & Nirmal Thapa (Putalisadak Head Office)</div>
                  <button onClick={() => window.print()} className="bg-[#173F7A] text-white font-bold px-4 py-2 rounded-xl">
                    Print Official Certificate
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* VIEW: TEST BANK EXPLORER */}
          {view === 'test-bank' && (
            <div className="max-w-7xl mx-auto px-4 py-8 space-y-6 flex-1">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h1 className="text-2xl font-black text-slate-900">100 Free IELTS Mock Tests</h1>
                  <p className="text-xs text-slate-500">Barron's Official, Cambridge 14–19, British Council & IDP Exam Banks</p>
                </div>
                <input
                  type="text"
                  placeholder="Search by test # or topic..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="px-4 py-2 border rounded-xl text-xs w-64 bg-white"
                />
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {TEST_CATALOG
                  .filter(t => !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase()) || String(t.id) === searchQuery)
                  .slice(0, 18)
                  .map((t) => (
                    <div key={t.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-center text-xs font-mono font-bold text-[#173F7A] mb-1">
                          <span>{t.code}</span>
                          <span className="text-[10px] bg-indigo-50 text-indigo-700 px-2 rounded">{t.format}</span>
                        </div>
                        <h4 className="font-bold text-sm text-slate-900">{t.title}</h4>
                        <div className="flex flex-wrap gap-1 mt-2">
                          {t.topics.map((tp, i) => (
                            <span key={i} className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">{tp}</span>
                          ))}
                        </div>
                      </div>
                      <button 
                        onClick={() => startTest(t, 'reading')}
                        className="mt-4 w-full bg-[#173F7A] hover:bg-blue-900 text-white font-bold text-xs py-2 rounded-xl transition"
                      >
                        Start Test
                      </button>
                    </div>
                  ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
